# 番茄幼苗移栽流水线配置（新流水线 seedling/ 使用；旧脚本仍读 config.json）
# 单位：米、弧度/度（字段名注明）、牛顿、秒。坐标系定义见 seedling/__init__.py。
# 标 [待测] 的数值是占位初值，需要在实验室实测后更新。

robot:
  host: 192.168.137.2           # FCI IP（沿用旧 config.json）
  realtime: enforce             # enforce | ignore。账户没有实时权限时只能 ignore，控制可能不稳定，仅限调试
  dynamics: 0.05                # 普通移动的相对速度/加速度/加加速度因子（0~1）
  fine_dynamics: 0.02           # 最终接近、拔出、放置等精细动作
  # franky 末端坐标系 E 相对法兰的变换（需与 Desk 里末端执行器设置一致）。Franka Hand 默认 z=0.1034、绕 z 转 -45°
  flange_to_ee:
    xyz_m: [0.0, 0.0, 0.1034]
    rpy_deg: [0.0, 0.0, -45.0]
  # 末端 E -> 夹爪接触中心 G 的平移（在 E 坐标系下）。Desk 里末端仍是 Franka Hand（E 在法兰下 103.4 mm）。
  # pin-brake 夹爪：2026-10-22 悬停检查（夹爪竖直朝下，程序让 G 停在托盘上沿上方 50 mm，实测指间中心在 77 mm）-> G 距法兰约 153 mm
  # （托盘上沿高度本身约 ±5 mm）；闭合方向 = G 的 y 轴（与相机长边平行，实测确认）
  ee_to_contact_xyz_m: [0.0, 0.0, 0.0496]
  # 接触中心允许到达的基座坐标范围（硬限制，超出即拒绝）[按实际桌面修改]
  workspace_m:
    x: [0.25, 0.85]
    y: [-0.45, 0.45]
    z: [0.01, 0.60]
  # 安全观察位（关节角，rad）。默认是 Franka 标准 ready 位姿；需要确保不挡相机视野 [待现场确认]
  home_joints_rad: [0.0, -0.785, 0.0, -2.356, 0.0, 1.571, 0.785]
  # 碰撞检测阈值（franky set_collision_behavior）；null 表示保持机器人当前设置
  collision_force_n: null
  ik_joint_margin_rad: 0.08

gripper:
  type: pin_brake               # pin_brake | franka_hand | serial | none | sim（2026-10-15 起换成实验室的 pin-brake 夹爪）
  open_width_m: 0.044           # pin-brake 张开时指间 44 mm（2026-10-22 实测）
  fingertip_ahead_of_contact_m: 0.013   # 沿接近方向（G 的 z 轴）指尖比指间中心再往前伸 13 mm（竖直悬停时实测：中心 77 mm、指尖 64 mm 高于托盘上沿）。
                                        # 实际是横着夹（水平接近），指尖会越过茎约 13 mm
  pin_brake:                    # 仅 type=pin_brake：驱动是项目根目录的 example_pinBrakeGripper.py（同学提供）
    # 固定填夹爪的 CH340。null 会逐个打开所有 USB 串口找固件 banner，打开串口会让别人的 Arduino 复位，共享电脑上不要用
    port: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
    pressure_kpa: 3.0           # 停止压力（同学在番茄茎上测得：p 3）
    close_width_mm: 2.0         # close 的名义宽度（同学测得：close 2），不随估计茎径变化
    close_forward_m: 0.013      # 夹茎时两指合拢点沿夹爪轴（G 的 z）比张开时的指间中心前移约 13 mm（2026-10-22 实夹 C7：
                                # 补偿 25 mm 时靠后没夹住，13 mm 正好夹住；空夹会转到底，前移 27 mm）。张开时 G 停在茎后方这么远
    # 闭合后固件保压约 100 kPa、气泵间歇工作有响声，是正常行为（同学确认）
  grasp_width_m: 0.0            # grasp() 目标宽度；0 表示用估计茎径
  grasp_speed_m_s: 0.02
  grasp_force_n: 20.0           # [待测] Franka Hand 力控精度在低力段有限，需夹持实验确定
  epsilon_inner_m: 0.006
  epsilon_outer_m: 0.02
  empty_close_width_m: 0.0003    # Franka Hand 实测 2026-10-05：空夹闭合读数 0.06–0.29 mm（且 is_grasped 会误报 True，只能看宽度）
  holding_margin_m: 0.0015      # 宽度 > 空夹宽度 + margin 视为夹到了东西
  serial:                       # 仅 type=serial 时使用
    port: /dev/ttyUSB0
    baudrate: 115200
    open_command: G0
    close_command: G70
    settle_s: 0.5

camera:
  serial_number: null           # null 为第一台；实验室多相机时填写
  resolution: HD1080
  fps: 15
  depth_mode: NEURAL            # 需 TensorRT 10（项目环境内）+ 已优化模型（2026-10-05 已在本机优化）；不可用时改 ULTRA
  depth_min_m: 0.30
  depth_max_m: 1.20
  confidence_threshold: 60      # ZED 置信度 1(最好)~100(最差)，SDK 先按该阈值过滤
  texture_confidence_threshold: 100
  warmup_frames: 15
  average_frames: 5             # 观测时多帧 XYZ 取中值，降低噪声
  flush_frames: 3               # 每次拍照先丢弃的帧数（手上相机刚停下时缓冲区里可能还是移动中的旧帧）
  # 双目偏差修正：校正图像上的视差比真实值大这么多像素（稠密深度和茎线三角化都用）。2026-10-12 用 99 个标记
  # （PnP，0.32–0.45 m）测得 19.2 px（不修正时深度短约 5.5%）；SDK 开机自校准可能改变它，34_wrist_calib_check.py 每次会重估。
  # 2026-10-20（相机重装、重启后）三组标定数据分别估计 17.0 / 15.3 / 15.2 px -> 15.8（1 px 约等于 0.36 m 处 1 mm 深度）
  disparity_offset_px: 15.8
  # 相机外壳（含支架余量）在左相机坐标系下的包围盒 [x, y, z] 范围（m）。ZED 2i 175×30×43 mm，左目在外壳中心左侧 60 mm
  housing_box_m: [[-0.045, 0.165], [-0.03, 0.03], [-0.06, 0.01]]
  mount: wrist                  # wrist = 装在机械臂手腕上（随臂移动）；fixed = 固定在外部
  T_flange_cam_file: calibration/T_flange_cam.yaml   # mount=wrist：相机相对法兰（32/33 脚本生成）
  T_base_cam_file: calibration/T_base_cam.yaml       # mount=fixed：相机相对基座（30/31 脚本生成）

perception:
  model: models/stem_yolo11n_v3_clean_one_stem.pt
  conf: 0.25
  imgsz: 960
  device: auto                  # auto | cpu | 0
  max_instances: 6
  roi_px: null                  # [x0, y0, x1, y1] 只在托盘工作区内找茎（可选，来自固定安装）
  # --- 中心线与分段 ---
  min_mask_area_px: 150
  segment_length_px: 60         # 每个候选段的图像长度（沿骨架）
  segment_step_px: 20
  max_bend_deg: 25.0            # 段内二维弯曲超过此值则拒绝
  # --- 三维拟合 ---
  max_point_confidence: 60      # 只用置信度 <= 此值的像素（与 camera.confidence_threshold 配合）
  depth_jump_m: 0.015           # 与段内深度中值相差超过此值的点视为背景/遮挡污染
  ransac_threshold_m: 0.003
  ransac_iterations: 200
  min_support_points: 25
  min_inlier_ratio: 0.5
  max_rms_m: 0.003
  min_length_m: 0.012
  surface_to_axis: true         # 把可见表面点沿视线后移半个茎径，近似茎轴

stemline:                       # 茎线双目三角化（seedling/stemline.py）：左右校正图像里找茎中心线再三角化，不依赖稠密深度
  exg_threshold: 0.05           # 绿色判定 ExG = (2g-r-b)/(r+g+b)，同时要求色相和饱和度（排除木头、橙色）
  hue_deg: [45, 150]
  min_saturation: 0.2
  min_brightness: 60
  min_plant_area_px: 800        # 默认取离图像中心最近的、面积不小于此值的绿色区域
  min_stem_length_m: 0.010      # 从茎根沿主茎（骨架最长路径）到叶片之前至少这么长才算找到茎
  max_stem_length_m: 0.04       # 只取茎的下段（较直，夹取点也在这一段）
  depth_range_m: [0.25, 0.9]
  min_match_score: 0.6          # 右图匹配：茎带灰度的归一化互相关下限（用灰度：同一根茎在两个相机里颜色可能不同）
  root_disparity_window_px: 12  # 茎根那一行的视差必须接近土团（稠密深度可靠）的视差
  min_vertical_fraction: 0.5    # 茎在图像里与水平线（双目基线方向）的夹角至少 30°，否则沿基线方向匹配有歧义
  max_root_extension_m: 0.04    # 从最低可见点向下延长到基质表面的最大长度
  base_min_contrast: 20         # 茎基部常发白、沾土（不是绿色）：从最低绿色像素起沿“比两侧亮的脊”继续往下追，灰度差下限
  max_root_above_soil_m: 0.008  # 追到的茎基比基质面（稠密深度）高出更多 -> 认为茎基被挡住，改为把茎线延长到基质面
  max_disparity_resid_px: 1.0   # 分段（每 9 行）单独匹配的视差与整体拟合之差的 RMS 上限，超过则认为匹配不可信
  grasp_offset_m: 0.02          # 夹取点：从茎根沿茎向上的距离

stembase:                       # 穴位里茎出土的那一小段（seedling/stembase.py）：只看土面上方一点，避开叶子和叶柄
  base_radius_m: 0.015          # 以穴位中心为轴的搜索半径（苗种在土块中心附近）
  base_z_m: [0.003, 0.025]      # 土面以上这段高度（这批苗的叶子多在 4 cm 以上）
  min_width_m: 0.0012           # 茎宽范围（图像中的亮细线）
  max_width_m: 0.006
  min_contrast: 15              # 白顶帽（比两侧泥土亮）灰度下限
  max_image_tilt_deg: 50        # 图里转正后，茎段与竖直方向夹角上限
  min_rows_fraction: 0.6        # 茎段在图里至少有按视角算出的应有长度的这么多
  max_tilt_deg: 50              # 三维倾角上限

grasp:
  # 侧向夹取（scripts/65_side_grasp.py）：合拢点相对穴位中心的偏移 [沿接近方向(水平), 沿闭合轴] mm。
  # 2026-10-22 第一次夹 C6 需往 C7 方向 10 mm（= 沿闭合轴 +10）；第二株 C7 带着这 10 mm 横向居中、正好夹住 -> 当作固定偏移
  side_offset_mm: [0.0, 0.0]
  # 侧向接近方向：相对“基座原点指向目标”的水平方向的偏航角，以及向下倾角
  approach_yaw_offsets_deg: [0, -25, 25]
  approach_pitch_deg: [30, 45]  # 水平接近(0°)时 FR3 第 6 关节接近上限，多数位置不可达
  pregrasp_distance_m: 0.08     # 预抓取点沿接近方向后退距离
  max_stem_tilt_deg: 35         # 茎相对竖直方向倾斜超过此值不抓
  table_z_m: 0.0                # 托盘/台面上表面在基座坐标的高度 [待测]
  min_contact_height_m: 0.015   # 接触中心最少高于 table_z
  finger_half_height_m: 0.009   # 手指在茎方向上的半高（用于离地检查）[按夹垫实测]
  finger_depth_m: 0.02          # 手指沿接近方向的长度
  finger_thickness_m: 0.008
  clearance_points_max: 30      # 手指扫掠体内允许的非目标点数
  max_stem_diameter_m: 0.012
  default_stem_diameter_m: 0.004

task:
  max_attempts: 2               # 每株最多尝试次数（含首次）
  reobserve_before_acquire: true
  pregrasp_joint_motion: true  # 从 home 到预抓取用关节空间运动（大幅转姿态时比笛卡尔直线稳妥）
  reobserve_max_shift_m: 0.006  # 再观察目标位移超过此值则重新规划
  guard_force_limit_n: 15.0     # 接近/运输/放置时意外接触的外力阈值（相对动作开始时的基线）[待测]
  verify_extraction_visual: true  # 拔出后重新拍照，检查原位置是否还有茎
  extraction_height_m: 0.08
  extraction_steps: 4
  extraction_force_limit_n: 30.0  # 外力估计超过此值则停止拔出（臂端估计，不是茎受力）[待测]
  transport_height_m: 0.30
  transport_waypoints_m: []     # 运输中间点 [[x,y,z], ...]，按实际障碍物添加
  place_position_m: [0.45, -0.30, 0.10]   # 接收杯/穴位内释放时接触中心位置 [待测]
  place_approach_height_m: 0.12           # 在接收位上方此高度开始下降
  release_dwell_s: 0.5

tray:
  file: calibration/tray.yaml   # 旧的示教托盘（45_teach_tray.py，已归档）；现在用 grid_file
  model:                        # 托盘穴位分布（固定）；托盘位置每次由 scripts/60_tray_locate.py 从一张照片求（seedling/traygrid.py）
    rows: 6
    cols: 12                    # 72 穴；A 行离机械臂最近，第 1 列在机械臂左手边
    pitch_m: 0.0448             # 2026-10-20 由照片拟合（横竖相同）[可用尺子量 5 格再核对]
    wall_m: 0.008               # 模板用：穴位之间隔墙顶面宽度
    rim_m: 0.006
    top_z_search_m: [0.03, 0.15]   # 在此高度范围内找托盘顶面
    search_x_m: [0.25, 1.25]
    search_y_m: [-0.55, 0.55]
    max_outside: 0.03           # 拟合出的托盘超出画面的比例上限（错开一整格约 8%；另有"格子在桌面高度"检查防止往画面内错开）
    min_score: 0.5
  grid_file: calibration/tray_grid.json   # 最近一次定位的 72 个穴位坐标
  overview_q: [0.113, -0.799, -0.181, -2.073, -0.152, 1.647, 0.706]   # 俯视总览姿态（相机约 0.62 m 高，俯视 82.5°）
  # 托盘模式的接近方向（相对“基座指向穴位”的水平方向）；只用 0 偏航，避免手指斜扫过相邻未拔的苗
  approach_yaw_offsets_deg: [0]
  approach_pitch_deg: [45, 60]  # 仿真 IK：30° 只有 x≥0.55 m 才可达；45°/60° 在 x=0.40–0.60 m 都可达
  observe:                      # 手上相机：每个穴位先移到斜上方的观察位，静止后拍照
    distance_m: 0.42            # 相机到穴位夹取点的距离（ZED 最近 0.3 m）
    elevation_deg: [55, 65, 45] # 视线向下的角度（0 = 水平，90 = 正上方），按顺序尝试
    azimuth_offsets_deg: [0, -25, 25, -60, 60]   # 相对“基座指向穴位”的水平方向；0 = 相机在机器人与穴位之间向外看
    roll_deg: [0, 45, -45, 90, -90, 135, -135, 180]  # 绕光轴转（180 = 图像倒置，对三维计算没有影响）；同一仰角下选关节变化最小的
    min_clearance_m: 0.12       # 相机外壳、法兰、夹爪接触点、腕部关节必须高于基质表面的距离
    # 手上相机标定验证过的关节范围（2026-10-20：范围内留出误差约 1 mm、最大约 2.5 mm；范围外实测 3–5 mm）。观察位只在此范围内选
    joint_range_rad: {5: [-0.5, 0.6], 7: [-0.75, 2.65]}
    max_joint_step_deg: 90      # 从当前姿态出发任一关节变化超过此值则换下一个候选
    settle_s: 0.5
  vision:                       # 逐穴位视觉修正（无需训练模型）
    base_radius_m: 0.02         # 茎在基质处的落点必须在穴位中心这个半径内 [约 0.4 × 穴距]
                                # 取点区域是自此半径向上按 max_tilt_deg 张开的锥形
    band_low_m: 0.008           # 只看基质表面以上这一段高度内的点（避开基质和高处叶片）
    band_high_m: 0.06
    refine_soil: true           # 用穴位内最低的稠密点层修正基质表面高度
    green_filter: true          # ExG = 2g - r - b（归一化色度）阈值分出绿色茎
    exg_threshold: 0.08         # [按现场光照调]
    min_brightness: 60
    min_points: 15
    min_vertical_span_m: 0.015  # 点的高度跨度不足时只估位置，不估倾斜
    ransac_threshold_m: 0.003
    max_tilt_deg: 40
    max_correction_m: 0.03      # 修正量超过此值视为误检
    fallback: nominal           # 视觉失败时：nominal = 按示教位置夹；reject = 跳过该穴位
    save_frames: true
